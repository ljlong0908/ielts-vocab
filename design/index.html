<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>雅词本 · 首页原型</title>
<style>
  :root {
    /* 与 miniprogram/app.wxss + design/tokens.html 同源 */
    --primary: #185fa5;
    --primary-soft: #e6f1fb;
    --success: #1d9e75;
    --success-soft: #e1f5ee;
    --warn: #ba7517;
    --danger: #a32d2d;
    --danger-soft: #fcebeb;
    --bg: #f6f7f9;
    --surface: #ffffff;
    --text: #1f2329;
    --text-2: #646a73;
    --text-3: #8f959e;
    --line: #e5e6eb;
    --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* 关键：<view> 是微信标签，浏览器默认当未知内联元素处理，会让卡片挤成一行。
     这里显式声明为块级，与小程序运行时行为一致。 */
  view { display: block; }
  html, body { background: #e9ebef; }
  body {
    color: var(--text);
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    font-size: 14px;
    line-height: 1.6;
    padding: 24px 0;
    display: flex;
    justify-content: center;
  }
  /* 模拟真机框：固定视口高度 + 内容区独立滚动，
     这样底部固定区才是真"固定"（与小程序 position:fixed 行为一致） */
  .phone {
    position: relative;
    width: 375px;
    height: 720px;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 8px 40px rgba(0,0,0,.08);
  }
  .nav { height: 44px; flex-shrink: 0; background: #fff; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid var(--line); }
  .nav .title { font-size: 16px; font-weight: 600; }

  /* page 容器：内部滚动；底部留出固定区高度，避免被遮挡 */
  .page { flex: 1; overflow-y: auto; padding: 12px 12px 190px; }

  .card { background: var(--surface); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; border: 1px solid var(--line); }
  .card.hero { background: linear-gradient(135deg, #fff 0%, var(--primary-soft) 100%); border-color: #d6e7f7; }
  .between { display: flex; align-items: center; justify-content: space-between; }
  .stat { text-align: center; flex: 1; }
  .stat .stat-num { font-size: 28px; font-weight: 700; color: var(--primary); line-height: 1.2; }
  .stat .muted { color: var(--text-2); font-size: 12px; margin-top: 2px; }
  .stat-right .stat-num { color: var(--success); }
  .divider { width: 1px; height: 32px; background: var(--line); }

  .title { font-size: 15px; font-weight: 600; }
  .muted { color: var(--text-2); font-size: 13px; }
  .hint { color: var(--text-3); font-size: 12px; }
  .tag { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 11px; background: var(--primary-soft); color: var(--primary); font-weight: 500; }

  .progress { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; margin: 10px 0 6px; }
  .progress .progress-bar { height: 100%; background: var(--primary); border-radius: 999px; transition: width .3s; }
  .progress-hint { margin-top: 4px; }

  /* 每日一句：静态语料按日轮换（非用户数据）。
     英文用衬线体拉开与正文的层次——引言卡片的经典处理；
     Android 无 Georgia 时自动回退系统无衬线，不影响可读。 */
  .speak {
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--primary-soft); color: var(--primary);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .quote-en {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 16px; line-height: 1.75;
    color: var(--text);
    margin: 12px 0 8px;
  }
  .quote-cn { font-size: 13px; color: var(--text-2); margin-bottom: 12px; }
  .quote-foot { display: flex; align-items: center; justify-content: space-between; }
  .quote-foot .author { font-size: 12px; color: var(--text-3); }
  .quote-tags { display: flex; gap: 6px; }
  .quote-tags .tag { background: var(--success-soft); color: var(--success); font-size: 10px; padding: 1px 8px; }

  .btn { display: block; height: 44px; line-height: 44px; border-radius: 22px; text-align: center; font-size: 15px; background: var(--surface); color: var(--text); border: 1px solid var(--line); }
  .btn.primary { background: var(--primary); color: #fff; border: none; font-weight: 500; box-shadow: 0 4px 12px rgba(24,95,165,.25); }
  /* 次级按钮：加练类操作，视觉降级（描边），不抢主 CTA 焦点 */
  .btn.ghost {
    height: 40px; line-height: 38px;
    border-radius: 20px;
    background: var(--primary-soft);
    color: var(--primary);
    border: 1px solid #cfe3f6;
    font-size: 14px;
    font-weight: 500;
  }

  /* 底部固定区：主 CTA + tab 栏，整体落在右手拇指舒适区 */
  .bottombar {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    background: #fff;
    border-top: 1px solid var(--line);
    padding: 10px 12px 12px;
    box-shadow: 0 -3px 14px rgba(0,0,0,.05);
  }
  .bottombar .btn.primary { width: 100%; margin-bottom: 8px; }
  .bottombar .btn.ghost { width: 100%; margin-bottom: 8px; }
  .btn.ghost .sup { font-size: 12px; color: #6f9ac4; }
  .tabbar { display: flex; }
  .tab { flex: 1; text-align: center; padding: 6px 0 2px; color: var(--text-3); }
  .tab.active { color: var(--primary); }
  .tab .tab-icon { width: 22px; height: 22px; margin: 0 auto 3px; display: flex; align-items: center; justify-content: center; }
  .tab .tab-label { font-size: 11px; line-height: 1.2; }

  .anno { color: var(--text-3); font-size: 10px; font-family: ui-monospace, monospace; text-align: center; padding: 12px; }
</style>
</head>
<body>
<div class="phone">

  <div class="nav"><div class="title">雅词本</div></div>

  <div class="page">

    <!-- hero：展示性内容，放顶部（难及区，不用点） -->
    <view class="card hero">
      <div class="between">
        <div class="stat">
          <div class="stat-num">7</div>
          <div class="muted">连续打卡（天）</div>
        </div>
        <div class="divider"></div>
        <div class="stat stat-right">
          <div class="stat-num">168</div>
          <div class="muted">累计学习（词）</div>
        </div>
      </div>
    </view>

    <!-- 今日进度 -->
    <view class="card">
      <div class="between">
        <div class="title">今日进度</div>
        <div class="tag">2 / 5</div>
      </div>
      <div class="progress">
        <div class="progress-bar" style="width: 40%"></div>
      </div>
      <div class="hint progress-hint">坚持每天一点，积少成多</div>
    </view>

    <!-- 每日一句：静态语料按日轮换 + 发音 + 雅思话题标签 -->
    <view class="card">
      <div class="between">
        <div class="title">每日一句</div>
        <div class="speak">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M8 3L4.5 6H2v4h2.5L8 13z" fill="currentColor"/><path d="M10.5 5.5c1 1 1 4 0 5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M12.6 3.9c1.8 1.8 1.8 6.4 0 8.2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        </div>
      </div>
      <div class="quote-en">It does not matter how slowly you go as long as you do not stop.</div>
      <div class="quote-cn">走得慢不要紧，只要不停下。</div>
      <div class="quote-foot">
        <div class="author">— Confucius</div>
        <div class="quote-tags">
          <text class="tag">毅力</text>
          <text class="tag">坚持</text>
        </div>
      </div>
    </view>

    <div class="anno">原型 · mock.js（progress 场景） · 底部固定区：主 CTA + 加练 + tab 栏（拇指舒适区）</div>

  </div>

  <!-- 底部固定区：主 CTA + 次级加练 + tab 栏，都在右手拇指自然弧线内 -->
  <div class="bottombar">
    <view class="btn primary">开始今日学习</view>
    <view class="btn ghost">再学一组 <text class="sup">+5 词</text></view>
    <div class="tabbar">
      <div class="tab active">
        <div class="tab-icon">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 9.5L10 4l7 5.5V16a1 1 0 01-1 1h-4v-5H8v5H4a1 1 0 01-1-1z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" fill="none"/></svg>
        </div>
        <div class="tab-label">首页</div>
      </div>
      <div class="tab">
        <div class="tab-icon">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="3" y="11" width="3" height="6" rx="1" fill="currentColor"/><rect x="8.5" y="7" width="3" height="10" rx="1" fill="currentColor"/><rect x="14" y="4" width="3" height="13" rx="1" fill="currentColor"/></svg>
        </div>
        <div class="tab-label">统计</div>
      </div>
      <div class="tab">
        <div class="tab-icon">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M5 3h10v14H5z" stroke="currentColor" stroke-width="1.5"/><path d="M8 7h4M8 10h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </div>
        <div class="tab-label">错题本</div>
      </div>
      <div class="tab">
        <div class="tab-icon">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="7" r="3" stroke="currentColor" stroke-width="1.5"/><path d="M4 17c0-3.3 2.7-6 6-6s6 2.7 6 6" stroke="currentColor" stroke-width="1.5"/></svg>
        </div>
        <div class="tab-label">我的</div>
      </div>
    </div>
  </div>

</div>
</body>
</html>
